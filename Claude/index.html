<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Lab · Token Optimization</title>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Matched to the infographic's zinc/orange palette */
      --bg: #09090b; 
      --card-bg: #18181b;
      --card-border: #3f3f46;
      --accent-main: #f97316; /* Tailwind orange-500 */
      --accent-hover: #ea580c; /* Tailwind orange-600 */
      --accent-alt: #f59e0b; /* Tailwind amber-500 */
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --font-mono: 'Fira Code', monospace;
      --font-sans: 'Inter', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body { 
      background-color: var(--bg); 
      color: var(--text-main); 
      font-family: var(--font-sans); 
      padding: 2rem 1rem; 
      max-width: 1200px; 
      margin: 0 auto; 
    }

    header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      padding-bottom: 1.5rem; 
      border-bottom: 1px solid var(--card-border); 
      margin-bottom: 2rem; 
    }

    header a { 
      color: var(--text-muted); 
      text-decoration: none; 
      font-family: var(--font-mono); 
      font-size: 0.9rem; 
      transition: color 0.2s;
    }

    header a:hover { 
      color: var(--accent-main); 
    }

    .brand-title {
      font-family: var(--font-mono); 
      font-size: 0.9rem;
      letter-spacing: 1px;
    }
    
    .brand-title b {
      color: var(--accent-main);
    }

    .tabs { 
      display: flex; 
      gap: 1rem; 
      margin-bottom: 2rem; 
      border-bottom: 1px solid var(--card-border); 
      padding-bottom: 1rem; 
    }

    .tab-btn { 
      background: var(--bg); 
      border: 1px solid var(--card-border); 
      color: var(--text-muted); 
      padding: 0.5rem 1rem; 
      font-family: var(--font-mono); 
      font-size: 0.85rem;
      cursor: pointer; 
      border-radius: 4px; 
      transition: all 0.2s;
    }

    .tab-btn:hover {
      border-color: var(--accent-alt);
      color: var(--text-main);
    }

    .tab-btn.active { 
      border-color: var(--accent-main); 
      color: var(--accent-main); 
      background: rgba(249, 115, 22, 0.1); /* Subtle orange tint */
    }
    
    .tab-content { display: none; }
    .tab-content.active { display: block; animation: fadeIn 0.3s ease-in; }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Seamless Iframe Styling */
    .iframe-container {
      border: 1px solid var(--card-border); 
      border-radius: 8px; 
      background: var(--bg);
      overflow: hidden;
      /* Subtle orange glow to match infographic */
      box-shadow: 0 0 25px -10px rgba(249, 115, 22, 0.15); 
    }

    iframe { 
      width: 100%; 
      height: 85vh; 
      border: none; 
      display: block;
    }

    /* Standard content styling for Tabs 2 and 3 */
    .lab-content {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 2rem;
    }

    .lab-content h2 {
      color: var(--accent-main);
      font-family: var(--font-mono);
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html">← Back to Hub</a>
    <div class="brand-title">CLAUDE <b>LAB</b></div>
  </header>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab(1)">01 CACHING</button>
    <button class="tab-btn" onclick="switchTab(2)">02 TOOLS LAB</button>
    <button class="tab-btn" onclick="switchTab(3)">03 MCP PROTOCOL</button>
  </div>

  <!-- TAB 1: User's Tailwind Infographic -->
  <div id="tab-1" class="tab-content active">
    <div class="iframe-container">
      <iframe src="claude_prompt_caching_infographic (2).html" title="Claude Token Caching"></iframe>
    </div>
  </div>

  <!-- TAB 2: Tools Content Placeholder -->
  <div id="tab-2" class="tab-content">
    <div class="lab-content">
      <h2>> Tools Lab</h2>
      <p>Optimization techniques for Caveman, RTK, Ponytail, and CodeGraph will be placed here.</p>
    </div>
  </div>

  <!-- TAB 3: MCP Content Placeholder -->
  <div id="tab-3" class="tab-content">
    <div class="lab-content">
      <h2>> MCP Protocol</h2>
      <p>Token-efficient Model Context Protocol server design guidelines will be placed here.</p>
    </div>
  </div>

  <script>
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById('tab-' + tabId).classList.add('active');
      event.currentTarget.classList.add('active');
    }
  </script>

</body>
</html>
